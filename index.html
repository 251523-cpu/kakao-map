<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 장소 검색 서비스</title>
    <style>
        /* CSS: 화면 레이아웃 설정 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Malgun Gothic', sans-serif; }

        .container { display: flex; width: 100%; height: 100vh; }

        /* 왼쪽 사이드바 (검색창 + 리스트) */
        .side-panel {
            width: 350px;
            height: 100%;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #ddd;
            z-index: 10;
        }

        .search-box { padding: 20px; background: #fff; border-bottom: 1px solid #eee; }
        .search-box h2 { margin-bottom: 15px; font-size: 1.2rem; color: #333; }
        .search-box input { width: 75%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .search-box button { width: 20%; padding: 10px; background: #fee500; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }

        #placesList { flex: 1; overflow-y: auto; list-style: none; padding: 10px; }
        #placesList li { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; background: #fff; margin-bottom: 5px; border-radius: 4px; }
        #placesList li:hover { background: #f0f0f0; }
        #placesList .place-name { font-weight: bold; color: #e67e22; display: block; }
        #placesList .address { font-size: 0.85rem; color: #666; margin-top: 5px; }

        /* 오른쪽 지도 영역 */
        .map-area { flex: 1; position: relative; }
        #map { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div class="container">
        <div class="side-panel">
            <div class="search-box">
                <h2>📍 장소 검색하기</h2>
                <form onsubmit="searchPlaces(); return false;">
                    <input type="text" id="keyword" placeholder="장소를 입력하세요" value="강남역 맛집">
                    <button type="submit">검색</button>
                </form>
            </div>
            <ul id="placesList"></ul>
        </div>

        <div class="map-area">
            <div id="map"></div>
        </div>
    </div>

    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=f6c1dcce9533c7c3fde4ea8e652c3ce8&libraries=services&autoload=false"></script>

    <script>
        let map;
        let ps; // 장소 검색 객체
        let markers = []; // 지도에 표시된 마커를 관리하는 배열

        // 1. API 로드 후 실행
        kakao.maps.load(function() {
            const container = document.getElementById('map');
            const options = {
                center: new kakao.maps.LatLng(37.566826, 126.9786567), // 기본 좌표 (서울시청)
                level: 5 // 확대 레벨
            };

            map = new kakao.maps.Map(container, options);
            ps = new kakao.maps.services.Places(); // 장소 검색 서비스 객체 생성

            // 2. 현재 위치 권한 요청 및 지도 중심 이동
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const locPosition = new kakao.maps.LatLng(lat, lon);
                    
                    map.setCenter(locPosition); // 현재 위치로 지도 중심 이동
                    displayMarker(locPosition, "내 현재 위치");
                }, function(err) {
                    console.error("위치 정보를 가져올 수 없습니다.");
                });
            }
        });

        // 장소 검색 함수
        function searchPlaces() {
            const keyword = document.getElementById('keyword').value;

            if (!keyword.replace(/^\s+|\s+$/g, '')) {
                alert('키워드를 입력해주세요!');
                return false;
            }

            // 카카오 검색 서비스 이용
            ps.keywordSearch(keyword, placesSearchCB);
        }

        // 검색 결과 콜백 함수
        function placesSearchCB(data, status, pagination) {
            if (status === kakao.maps.services.Status.OK) {
                displayPlaces(data); // 리스트 표시
                displayMarkers(data); // 마커 표시
            } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                alert('검색 결과가 존재하지 않습니다.');
            } else if (status === kakao.maps.services.Status.ERROR) {
                alert('검색 결과 중 오류가 발생했습니다.');
            }
        }

        // 검색 결과 리스트 표시
        function displayPlaces(places) {
            const listEl = document.getElementById('placesList');
            listEl.innerHTML = ''; // 이전 결과 초기화

            places.forEach((place, index) => {
                const itemEl = document.createElement('li');
                itemEl.innerHTML = `
                    <span class="place-name">${index + 1}. ${place.place_name}</span>
                    <span class="address">${place.road_address_name || place.address_name}</span>
                `;

                // 리스트 클릭 시 해당 위치로 지도 이동
                itemEl.onclick = function() {
                    const moveLatLon = new kakao.maps.LatLng(place.y, place.x);
                    map.panTo(moveLatLon);
                };

                listEl.appendChild(itemEl);
            });
        }

        // 지도에 마커 표시
        function displayMarkers(places) {
            removeMarkers(); // 기존 마커 제거
            const bounds = new kakao.maps.LatLngBounds();

            places.forEach(place => {
                const placePosition = new kakao.maps.LatLng(place.y, place.x);
                const marker = new kakao.maps.Marker({
                    position: placePosition,
                    map: map
                });

                markers.push(marker);
                bounds.extend(placePosition);
            });

            map.setBounds(bounds); // 검색된 장소들이 모두 보이도록 지도 범위 조정
        }

        // 기존 마커 삭제 함수
        function removeMarkers() {
            markers.forEach(marker => marker.setMap(null));
            markers = [];
        }

        // 단순 마커 표시 함수 (내 위치용)
        function displayMarker(position, message) {
            const marker = new kakao.maps.Marker({
                map: map,
                position: position
            });
        }
    </script>
</body>
</html>
